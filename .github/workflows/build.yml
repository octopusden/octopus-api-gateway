# INTERNAL — runs on push to main, on manual dispatch, and as a workflow_call unit of the Merge Gate.
name: Gradle Build & UT

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v3.0.0
    with:
      flow-type: hybrid
      java-version: '21'
      docker-image: api-gateway
    secrets: inherit
